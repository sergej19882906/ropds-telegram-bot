[package]
name = "ropds-telegram-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Отключаем default-features и явно включаем rustls, чтобы НЕ использовать OpenSSL
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dashmap = "6"
urlencoding = "2"
base64 = "0.22"
redis = { version = "0.25", features = ["tokio-comp", "aio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
